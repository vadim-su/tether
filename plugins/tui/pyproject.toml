[project]
name = "tether-plugin-tui"
version = "0.1.0"
description = "Terminal UI for tether, on Textual"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tether",
    "textual>=8.2,<9",
]

[project.entry-points."tether.frontends"]
tui = "tether_plugin_tui:TuiFrontend"

[tool.uv.sources]
tether = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether_plugin_tui"]
