[project]
name = "tether"
version = "0.1.0"
description = "Moddable agent harness on Pydantic AI: everything is a plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim>=2.54,<3",
    # Alpha (0.x): pinned to a minor version, bump deliberately.
    "pydantic-ai-harness>=0.54,<0.55",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]"]
openai = ["pydantic-ai-slim[openai]"]

[project.scripts]
tether = "tether.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
