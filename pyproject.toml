[project]
name = "tether"
version = "0.1.0"
description = "Moddable agent harness on Pydantic AI: everything is a plugin"
readme = "README.md"
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3.14"]
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.54,<3",  # the default model is Claude Haiku
    # Alpha (0.x): pinned to a minor version, bump deliberately.
    "pydantic-ai-harness>=0.54,<0.55",
    "pyyaml>=6",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]"]

[project.scripts]
tether = "tether.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "tether-plugin-tui"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
tether-plugin-tui = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tether", "tether_plugin_tui"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
filterwarnings = ["ignore::DeprecationWarning"]
